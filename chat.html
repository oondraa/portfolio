<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Chat | oondraa</title>
<meta name="description" content="Send Ondra (oondraa) a message directly. Fastest way to get in touch.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://oondraa.pages.dev/chat.html">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
<link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/phosphor/style.css">
<script>
  // Apply saved theme before first paint to avoid a flash.
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  @font-face {
    font-family: "Geist";
    src: url("/fonts/geist-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900; font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Geist";
    src: url("/fonts/geist-latin-ext-wght-normal.woff2") format("woff2");
    font-weight: 100 900; font-display: swap;
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  :root {
    --bg: #f4f4f5;
    --surface: #ffffff;
    --surface-2: #e9e9ec;
    --text: #111114;
    --muted: #595963;
    --line: rgba(17, 17, 20, 0.1);
    --accent: #1760f0;
    --accent-fill: #1760f0;
    --accent-fill-hover: #0f4fd0;
    --nav-bg: rgba(244, 244, 245, 0.78);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0d;
      --surface: #141417;
      --surface-2: #1c1c20;
      --text: #ececef;
      --muted: #a0a0ab;
      --line: rgba(255, 255, 255, 0.09);
      --accent: #5b93ff;
      --accent-fill: #1f66f2;
      --accent-fill-hover: #3a7aff;
      --nav-bg: rgba(11, 11, 13, 0.74);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0b0d;
    --surface: #141417;
    --surface-2: #1c1c20;
    --text: #ececef;
    --muted: #a0a0ab;
    --line: rgba(255, 255, 255, 0.09);
    --accent: #5b93ff;
    --accent-fill: #1f66f2;
    --accent-fill-hover: #3a7aff;
    --nav-bg: rgba(11, 11, 13, 0.74);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh; display: flex; flex-direction: column;
  }
  a { color: var(--accent); text-decoration: none; }
  textarea, button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  .wrap { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 24px; }

  .nav {
    position: sticky; top: 0; z-index: 20; background: var(--nav-bg);
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
  }
  .nav .wrap { height: 64px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .back { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--muted); justify-self: start; padding: 8px 12px 8px 8px; border-radius: 999px; transition: background 0.2s var(--ease), color 0.2s var(--ease); }
  .back:hover { color: var(--text); background: var(--surface-2); }
  .title { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }

  main { flex: 1; display: flex; }
  main .wrap { display: flex; flex-direction: column; padding-top: 32px; padding-bottom: 24px; }
  #thread { display: flex; flex-direction: column; gap: 10px; padding-bottom: 24px; }
  .bubble { max-width: 78%; border-radius: 16px; padding: 12px 16px; font-size: 16px; line-height: 1.5; white-space: pre-wrap; animation: pop 0.35s var(--ease) both; }
  .bubble.in { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); }
  .bubble.out { align-self: flex-end; background: var(--accent-fill); color: #fff; }
  .note { display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-size: 15px; }
  .note a { font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }

  .composer { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .composer label { font-size: 14px; font-weight: 500; color: var(--muted); padding-left: 4px; }
  .field {
    display: flex; align-items: flex-end; gap: 10px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 16px;
    transition: border-color 0.2s var(--ease);
  }
  .field:focus-within { border-color: var(--accent); }
  textarea { flex: 1; min-width: 0; border: none; outline: none; resize: none; background: transparent; font-size: 16px; line-height: 1.5; padding: 9px 0; max-height: 160px; }
  textarea::placeholder { color: var(--muted); }
  .send {
    width: 42px; height: 42px; flex-shrink: 0; border: none; border-radius: 999px; background: var(--accent-fill); color: #fff;
    cursor: pointer; display: grid; place-items: center; font-size: 19px;
    transition: background 0.2s var(--ease), transform 0.15s var(--ease);
  }
  .send:hover { background: var(--accent-fill-hover); }
  .send:active { transform: scale(0.94); }
  .hint { font-size: 13px; color: var(--muted); padding-left: 4px; }

  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .bubble { animation: none; } }
  @media (max-width: 767px) { .wrap { padding: 0 16px; } main .wrap { padding-top: 24px; } }
</style>
</head>
<body>

  <header class="nav">
    <div class="wrap">
      <a class="back" href="index.html"><i class="ph ph-arrow-left" aria-hidden="true"></i>Back</a>
      <span class="title">Live Chat</span>
      <span></span>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div id="thread" aria-live="polite">
        <div class="bubble in">Hey. Fastest way to reach me. What's on your mind?</div>
      </div>

      <div class="composer">
        <label for="draft">Your message</label>
        <div class="field">
          <textarea id="draft" rows="1" placeholder="Write a message"></textarea>
          <button id="send-btn" class="send" type="button" aria-label="Send"><i class="ph ph-arrow-up" aria-hidden="true"></i></button>
        </div>
        <div class="hint">Usually replies within a day.</div>
      </div>
    </div>
  </main>

<script>
(function () {
  var EMAIL = "o.zajicek12@gmail.com";
  var thread = document.getElementById("thread");
  var draft = document.getElementById("draft");
  var sendBtn = document.getElementById("send-btn");
  var sent = [];

  function bubble(text) {
    var div = document.createElement("div");
    div.className = "bubble out";
    div.textContent = text;
    thread.appendChild(div);
  }

  function deliveryNote() {
    var body = sent.join("\n\n");
    var mailto = "mailto:" + EMAIL + "?subject=" + encodeURIComponent("Hi from your portfolio") + "&body=" + encodeURIComponent(body);
    var div = document.createElement("div");
    div.id = "delivery-note";
    div.className = "bubble in note";
    var p = document.createElement("span");
    p.textContent = "Got it. Send it through email below and it goes straight to me.";
    var a = document.createElement("a");
    a.href = mailto;
    a.innerHTML = 'Send via email <i class="ph ph-arrow-right" aria-hidden="true"></i>';
    div.appendChild(p);
    div.appendChild(a);
    thread.appendChild(div);
  }

  function autosize() {
    draft.style.height = "auto";
    draft.style.height = Math.min(draft.scrollHeight, 160) + "px";
  }

  function send() {
    var text = draft.value.trim();
    if (!text) { draft.focus(); return; }
    bubble(text);
    sent.push(text);
    draft.value = "";
    autosize();
    var note = document.getElementById("delivery-note");
    if (note) note.remove();
    deliveryNote();
    thread.lastElementChild.scrollIntoView({ block: "end" });
  }

  sendBtn.addEventListener("click", send);
  draft.addEventListener("input", autosize);
  draft.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
})();
</script>
</body>
</html>
