<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Chat | oondraa</title>
<meta name="description" content="Send Ondra (oondraa) a message directly — fastest way to get in touch.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://oondraa.pages.dev/chat.html">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F2F2F7">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #F2F2F7; -webkit-font-smoothing: antialiased; }
  a { color: #0088FF; text-decoration: none; }
  a:hover { color: #006FD6; }
  textarea, input, button { font-family: inherit; }
  textarea:focus { outline: none; }
  #send-btn:hover { background: #006FD6 !important; }
  #back-link:hover { color: #006FD6; }
</style>
</head>
<body>
<div style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, sans-serif; background: #F2F2F7; color: #000; min-height: 100vh; display: flex; flex-direction: column;">

  <div style="position: sticky; top: 0; z-index: 20; background: rgba(242,242,247,0.18); backdrop-filter: saturate(240%) blur(72px); -webkit-backdrop-filter: saturate(240%) blur(72px); border-bottom: 0.5px solid rgba(0,0,0,0.06); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 12px rgba(0,0,0,0.04);">
    <div style="max-width: 720px; margin: 0 auto; padding: 0 20px; height: 50px; display: flex; align-items: center; gap: 12px;">
      <a id="back-link" href="index.html" style="display: inline-flex; align-items: center; gap: 4px; font-size: 17px; color: #0088FF;">
        <svg viewBox="0 0 24 24" style="width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round;"><path d="M15 4l-8 8 8 8"></path></svg>
        Back
      </a>
      <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.02em; margin: 0 auto; padding-right: 56px;">Live Chat</span>
    </div>
  </div>

  <div style="flex: 1; width: 100%; max-width: 720px; margin: 0 auto; padding: 28px 20px 0; display: flex; flex-direction: column; gap: 8px;">

    <div id="thread" style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px;">
      <div style="align-self: flex-start; max-width: 78%; background: #FFFFFF; border-radius: 22px; padding: 12px 18px; font-size: 17px; line-height: 1.45;">Hey. Fastest way to reach me. What's on your mind?</div>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 20px;">
      <div style="display: flex; align-items: flex-end; gap: 10px; background: #FFFFFF; border-radius: 26px; padding: 8px 8px 8px 20px;">
        <textarea id="draft" rows="1" placeholder="Message" style="flex: 1; min-width: 0; border: none; outline: none; resize: none; background: transparent; font-size: 17px; line-height: 1.45; padding: 10px 0; max-height: 140px; color: #000;"></textarea>
        <button id="send-btn" aria-label="Send" style="width: 40px; height: 40px; flex-shrink: 0; border: none; border-radius: 100px; background: #0088FF; cursor: pointer; display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: none; stroke: #FFFFFF; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;"><path d="M12 20V5M6 11l6-6 6 6"></path></svg>
        </button>
      </div>
      <div style="padding: 2px 18px 0; font-size: 13px; line-height: 1.45; color: rgba(60,60,67,0.6);">Usually replies within a day.</div>
    </div>

  </div>
</div>
<script>
(function () {
  var EMAIL = "o.zajicek12@gmail.com";
  var thread = document.getElementById("thread");
  var draft = document.getElementById("draft");
  var sendBtn = document.getElementById("send-btn");
  var sent = [];

  function bubble(text) {
    var div = document.createElement("div");
    div.style.cssText = "align-self: flex-end; max-width: 78%; background: #0088FF; color: #FFFFFF; border-radius: 22px; padding: 12px 18px; font-size: 17px; line-height: 1.45; white-space: pre-wrap;";
    div.textContent = text;
    thread.appendChild(div);
  }

  function deliveryNote() {
    var existing = document.getElementById("delivery-note");
    if (existing) return;
    var body = sent.join("\n\n");
    var mailto = "mailto:" + EMAIL + "?subject=" + encodeURIComponent("Hi from your portfolio") + "&body=" + encodeURIComponent(body);
    var div = document.createElement("div");
    div.id = "delivery-note";
    div.style.cssText = "align-self: flex-start; max-width: 78%; background: #FFFFFF; border-radius: 22px; padding: 12px 18px; font-size: 15px; line-height: 1.45; color: rgba(60,60,67,0.6); display: flex; flex-direction: column; gap: 8px;";
    var p = document.createElement("span");
    p.textContent = "Got it — now pick a channel below and it goes straight to me.";
    var a = document.createElement("a");
    a.href = mailto;
    a.textContent = "Send via email →";
    a.style.cssText = "color: #0088FF; font-weight: 600;";
    div.appendChild(p);
    div.appendChild(a);
    thread.appendChild(div);
  }

  function send() {
    var text = draft.value.trim();
    if (!text) return;
    bubble(text);
    sent.push(text);
    draft.value = "";
    var note = document.getElementById("delivery-note");
    if (note) note.remove();
    deliveryNote();
    thread.scrollIntoView({ block: "end" });
  }

  sendBtn.addEventListener("click", send);
  draft.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
})();
</script>
</body>
</html>
